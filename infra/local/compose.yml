services:
  postgres:
    image: postgis/postgis:17-3.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dealse
      POSTGRES_USER: dealse
      POSTGRES_PASSWORD: dealse_local_dev_only
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - dealse-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dealse-postgres-data:
