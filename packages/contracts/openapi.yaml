openapi: 3.1.0
info:
  title: DealSe API
  version: 1.0.0
  description: DealSe customer and retailer API contract.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: API liveness check
      security: []
      responses:
        "200":
          description: API process is responding.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
  /offers/redeem:
    post:
      operationId: redeemCustomerOffer
      summary: Redeem a customer offer from the captured QR code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemOfferRequest"
      responses:
        "200":
          description: Offer redeemed for the specified customer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedeemOfferResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Offer does not exist for this customer or store.
        "409":
          description: QR payload belongs to a different customer or the offer is no longer active.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Resolve the current authenticated DealSe user
      responses:
        "200":
          description: Current user identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /retailers:
    post:
      operationId: createRetailer
      summary: Create a retailer account in pending verification state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRetailerRequest"
      responses:
        "201":
          description: Retailer and active owner membership created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Retailer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /retailers/mine:
    get:
      operationId: listMyRetailers
      summary: List retailers where the current user has an active membership
      responses:
        "200":
          description: Retailers visible to the current user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RetailerMembershipView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /retailers/{retailerId}/stores:
    parameters:
      - name: retailerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listRetailerStores
      summary: List stores for an actively accessible retailer membership
      responses:
        "200":
          description: Retailer stores, including draft stores visible to members.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Store"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Retailer not found or inaccessible to this user.
    post:
      operationId: createRetailerStore
      summary: Create a draft store for an active retailer
      description: Only active owners and managers may create stores. Verification and publication status are assigned by the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStoreRequest"
      responses:
        "201":
          description: Draft store created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Membership does not allow store management.
        "404":
          description: Retailer not found or inaccessible to this user.
        "409":
          description: Store slug is already used by this retailer.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CurrentUser:
      type: object
      required: [id, email, emailVerified]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: [string, "null"]
          format: email
        emailVerified:
          type: boolean
    RedeemOfferRequest:
      type: object
      additionalProperties: false
      required: [code, customerId]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        customerId:
          type: string
          minLength: 1
          maxLength: 128
        offerId:
          type: [string, "null"]
          maxLength: 128
        storeName:
          type: [string, "null"]
          maxLength: 200
        scannedPayload:
          type: [string, "null"]
          description: Raw QR payload captured from the customer app.
    RedeemOfferResponse:
      type: object
      required: [status, redeemedAt, offer, customer, history, removedFromCustomerApp]
      properties:
        status:
          type: string
          const: redeemed
        redeemedAt:
          type: string
          format: date-time
        message:
          type: string
        offer:
          type: object
          required: [id, title, storeName, customerName]
          properties:
            id:
              type: string
            title:
              type: string
            storeName:
              type: string
            customerName:
              type: string
        customer:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
            name:
              type: string
        history:
          type: object
          required: [method, capturedCode, storeName, redeemedAt]
          properties:
            method:
              type: string
            capturedCode:
              type: string
            storeName:
              type: string
            redeemedAt:
              type: string
              format: date-time
        removedFromCustomerApp:
          type: boolean
    CreateRetailerRequest:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 180
        legalName:
          type: [string, "null"]
          minLength: 2
          maxLength: 255
    Retailer:
      type: object
      required: [id, displayName, legalName, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        legalName:
          type: [string, "null"]
        status:
          type: string
          enum: [pending, active, suspended, closed]
        role:
          type: string
          enum: [owner, manager, staff]
        createdAt:
          type: string
          format: date-time
    RetailerMembershipView:
      allOf:
        - $ref: "#/components/schemas/Retailer"
        - type: object
          required: [role]
          properties:
            role:
              type: string
              enum: [owner, manager, staff]
    CreateStoreRequest:
      type: object
      additionalProperties: false
      required: [slug, name, city, region]
      properties:
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          minLength: 2
          maxLength: 120
        name:
          type: string
          minLength: 2
          maxLength: 180
        description:
          type: [string, "null"]
          maxLength: 2000
        categoryId:
          type: [string, "null"]
          format: uuid
        phone:
          type: [string, "null"]
          maxLength: 32
        email:
          type: [string, "null"]
          format: email
          maxLength: 320
        addressLine1:
          type: [string, "null"]
          maxLength: 255
        addressLine2:
          type: [string, "null"]
          maxLength: 255
        locality:
          type: [string, "null"]
          maxLength: 120
        city:
          type: string
          minLength: 1
          maxLength: 100
        region:
          type: string
          minLength: 1
          maxLength: 100
        postalCode:
          type: [string, "null"]
          maxLength: 24
        countryCode:
          type: string
          pattern: "^[A-Z]{2}$"
          default: IN
        timezone:
          type: string
          maxLength: 64
          default: Asia/Kolkata
        latitude:
          type: [number, "null"]
          minimum: -90
          maximum: 90
        longitude:
          type: [number, "null"]
          minimum: -180
          maximum: 180
    Store:
      type: object
      required: [id, retailerId, slug, name, city, region, countryCode, timezone, status, createdAt, latitude, longitude]
      properties:
        id:
          type: string
          format: uuid
        retailerId:
          type: string
          format: uuid
        categoryId:
          type: [string, "null"]
          format: uuid
        slug:
          type: string
        name:
          type: string
        description:
          type: [string, "null"]
        city:
          type: string
        region:
          type: string
        countryCode:
          type: string
        timezone:
          type: string
        status:
          type: string
          enum: [draft, pending_verification, active, paused, closed]
        latitude:
          type: [number, "null"]
        longitude:
          type: [number, "null"]
        createdAt:
          type: string
          format: date-time
    ApiError:
      type: object
      additionalProperties: true
      properties:
        statusCode:
          type: integer
        message:
          type: [string, array]
        error:
          type: string
  responses:
    BadRequest:
      description: Input failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: Missing, expired or invalid bearer access token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unavailable:
      description: OIDC or a required service is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
