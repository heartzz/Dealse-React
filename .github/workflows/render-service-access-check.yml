name: Render service access check

on:
  workflow_dispatch:

permissions: {}

jobs:
  verify-render-service-access:
    if: github.ref == 'refs/heads/stabilization/retailer-offer-workflow'
    runs-on: ubuntu-latest
    steps:
      - name: Read Render service details
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const expectedId = 'srv-dbtfm43rjlhs73f7cnlg';
          const apiKey = process.env.RENDER_API_KEY;

          if (!apiKey) {
            console.error('RENDER_API_KEY is not configured.');
            process.exit(1);
          }

          const response = await fetch(`https://api.render.com/v1/services/${expectedId}`, {
            method: 'GET',
            headers: {
              Authorization: `Bearer ${apiKey}`,
              Accept: 'application/json',
            },
          });

          console.log(`HTTP_STATUS=${response.status}`);

          let payload;
          try {
            payload = await response.json();
          } catch {
            console.error('Render returned a non-JSON response.');
            process.exit(1);
          }

          const service = payload?.service ?? payload;
          const returnedId = service?.id;
          const returnedName = service?.name;

          console.log(`SERVICE_ID=${typeof returnedId === 'string' ? returnedId : 'missing'}`);
          console.log(`SERVICE_NAME=${typeof returnedName === 'string' ? returnedName : 'missing'}`);

          if (!response.ok || returnedId !== expectedId || returnedName !== 'dealse-api-staging') {
            console.error('Render service access verification failed.');
            process.exit(1);
          }

          console.log('RENDER_API_KEY_ACCESS=verified');
          NODE
